[package]
name = "omp-deck"
version = "0.2.0"
edition = "2024"
description = "Web dashboard listing the live omp collab sessions on this machine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yukimemi/omp-deck"
keywords = ["omp", "dashboard", "collab"]
categories = ["command-line-utilities"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
which = "8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
