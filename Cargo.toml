[package]
name = "omp-deck"
version = "0.5.0"
edition = "2024"
description = "Web dashboard listing the live omp collab sessions on this machine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yukimemi/omp-deck"
keywords = ["omp", "dashboard", "collab"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
kaishin = "0.7.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
which = "8"
teravars = { version = "0.2.2", features = ["merge"] }
toml = "1.1.6"
dirs = "6"

[dev-dependencies]
parking_lot = "0.12.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
