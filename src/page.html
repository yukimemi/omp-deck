<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='40' height='40' rx='6' fill='%231c1c22' stroke='%2333333d' stroke-width='2'/%3E%3Crect x='18' y='6' width='40' height='40' rx='6' fill='%23d9480f'/%3E%3Crect x='26' y='16' width='24' height='4' rx='2' fill='%23fff'/%3E%3Crect x='26' y='24' width='16' height='4' rx='2' fill='%23fff' opacity='.8'/%3E%3C/svg%3E">
<title>omp deck</title>
<style>
:root { color-scheme: light dark; --bg: #f4f4f6; --fg: #1b1b1f; --card: #fff; --muted: #6b6b76; --line: #d9d9e0; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121216; --fg: #ececf1; --card: #1c1c22; --muted: #9a9aa6; --line: #33333d; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 1rem; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
h1 { font-size: 1.2rem; margin: 0 0 1rem; }
.grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr)); }
.card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: .6rem; padding: .8rem; }
.card.input { border-color: #d9480f; box-shadow: 0 0 0 2px #d9480f; }
.card header { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.card h2 { font-size: 1.05rem; margin: 0; min-width: 0; overflow-wrap: break-word; word-break: normal; }
.badge { flex: none; font-size: .75rem; font-weight: 700; padding: .1rem .5rem; border-radius: 1rem; text-transform: uppercase; }
.badge.input { background: #d9480f; color: #fff; }
.badge.busy { background: #1971c2; color: #fff; }
.badge.idle { background: var(--line); color: var(--muted); }
.meta { margin: .3rem 0 0; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: .5rem; margin: .7rem 0 0; }
.links > a, .links > button { flex: 1 0 auto; min-width: 4.5rem; white-space: nowrap; text-align: center; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: .4rem; background: var(--card); color: inherit; text-decoration: none; font: inherit; font-weight: 600; cursor: pointer; }
.links a.control { background: var(--fg); color: var(--bg); }
.links button.stop { border-color: #c92a2a; color: #c92a2a; }
.links button.resume { border-color: #1971c2; color: #1971c2; }
.links button:disabled { opacity: .5; cursor: default; }
.note { padding: 1rem; border: 1px dashed var(--line); border-radius: .6rem; color: var(--muted); }
.error { padding: 1rem; border: 2px solid #c92a2a; border-radius: .6rem; }
.error pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: .5rem 0 0; }
details#new-session { min-width: 0; margin: 0 0 1rem; background: var(--card); border: 1px solid var(--line); border-radius: .6rem; padding: .6rem .8rem; }
details#new-session summary { cursor: pointer; font-weight: 600; }
#new-session form { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; margin-top: .7rem; }
#new-session label { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: .2rem; font-size: .85rem; color: var(--muted); }
#new-session select, #new-session input, #new-session button { box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; font: inherit; padding: .5rem; border-radius: .4rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
#new-session select { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#new-session button { background: var(--fg); color: var(--bg); font-weight: 600; cursor: pointer; }
#new-session button:disabled { opacity: .5; cursor: default; }
#ns-status { margin: 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
#ns-status.err { color: #c92a2a; }
code { font-family: ui-monospace, monospace; }
#self-update { display: flex; align-items: center; gap: .6rem; margin: 0 0 1rem; }
#su-btn { font: inherit; padding: .4rem .8rem; border-radius: .4rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
#su-btn:disabled { opacity: .5; cursor: default; }
#su-status { margin: 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
#su-status.err { color: #c92a2a; }
</style>
</head>
<body>
<h1>omp deck</h1>
<div id="self-update">
<button id="su-btn" type="button">Update &amp; restart</button>
<p id="su-status" role="status"></p>
</div>
<details id="new-session">
<summary>New session</summary>
<form id="ns-form">
<label>Repository <input type="search" id="ns-filter" placeholder="Filter by owner/name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Filter repositories"><select id="ns-repo" required></select></label>
<label id="ns-resume-label" hidden>Resume a past session <select id="ns-resume"><option value="">(start new session)</option></select></label>
<label id="ns-model-label" hidden>Model <select id="ns-model"><option value="">(omp default)</option></select></label>
<button type="submit" id="ns-go" disabled>Start omp</button>
<p id="ns-status" role="status"></p>
</form>
</details>
<!--BODY-->
<script>
(function () {
  var suBtn = document.getElementById("su-btn");
  var suStatus = document.getElementById("su-status");
  function suSay(text, err) { suStatus.textContent = text; suStatus.className = err ? "err" : ""; }
  suBtn.addEventListener("click", function () {
    if (!window.confirm("Check for a newer omp-deck release and restart onto it if found? The dashboard is briefly unreachable during the restart.")) return;
    suBtn.disabled = true;
    suSay("checking...", false);
    fetch("/api/self-update", { method: "POST" }).then(function (r) {
      if (r.status === 202) {
        return r.json().then(function (data) {
          suSay("updating to " + (data.tag || "a newer release") + "; reloading shortly", false);
          // The handover briefly drops every connection, so this waits out
          // the restart rather than reloading into a closed port.
          setTimeout(function () { location.reload(); }, 8000);
        });
      }
      if (r.status === 200) { suSay("already up to date", false); suBtn.disabled = false; return; }
      return r.text().then(function (t) { suSay("failed (" + r.status + "): " + t, true); suBtn.disabled = false; });
    }).catch(function (e) { suSay("failed: " + e, true); suBtn.disabled = false; });
  });
  var box = document.getElementById("new-session");
  var repo = document.getElementById("ns-repo");
  var filter = document.getElementById("ns-filter");
  var model = document.getElementById("ns-model");
  var modelLabel = document.getElementById("ns-model-label");
  var resume = document.getElementById("ns-resume");
  var resumeLabel = document.getElementById("ns-resume-label");
  var go = document.getElementById("ns-go");
  var status = document.getElementById("ns-status");
  var loaded = false;
  var sessionsFor = null;
  function say(text, err) { status.textContent = text; status.className = err ? "err" : ""; }
  function opt(value, text) { var o = document.createElement("option"); o.value = value; o.textContent = text; return o; }
  var allRepos = [];
  // Case-insensitive substring match on the full name (owner/name) and the short name.
  function matches(r, q) {
    q = q.trim().toLowerCase();
    if (!q) return true;
    var full = r.name.toLowerCase();
    return full.indexOf(q) !== -1 || full.split("/").pop().indexOf(q) !== -1;
  }
  // Rebuild the options rather than hiding them (hidden <option> is ignored on iOS Safari).
  // The selection survives if still matching, else it moves to the first match.
  function renderRepos() {
    var q = filter.value, prev = repo.value;
    var shown = allRepos.filter(function (r) { return matches(r, q); });
    repo.textContent = "";
    if (shown.length === 0) {
      if (allRepos.length === 0) { go.disabled = true; return; }
      var none = opt("", "No repositories match \u201c" + q.trim() + "\u201d");
      none.disabled = true; none.selected = true;
      repo.appendChild(none);
    } else {
      shown.forEach(function (r) { repo.appendChild(opt(r.path, r.name + "  (" + r.path + ")")); });
      if (prev && shown.some(function (r) { return r.path === prev; })) repo.value = prev;
    }
    go.disabled = !repo.value;
    maybeLoadSessions();
  }
  filter.addEventListener("input", renderRepos);
  // Enter in the filter box would submit the form and start omp on whatever is selected.
  filter.addEventListener("keydown", function (ev) { if (ev.key === "Enter") ev.preventDefault(); });
  // Past sessions for the currently selected repo, refetched only when the
  // selection actually changes (renderRepos runs on every filter keystroke).
  function maybeLoadSessions() {
    if (repo.value === sessionsFor) return;
    sessionsFor = repo.value;
    resume.textContent = "";
    resume.appendChild(opt("", "(start new session)"));
    resumeLabel.hidden = true;
    go.textContent = "Start omp";
    if (!repo.value) return;
    fetch("/api/repos/" + encodeURIComponent(repo.value) + "/sessions")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (repo.value !== sessionsFor) return; // selection moved on while this was in flight
        var list = data.sessions || [];
        list.forEach(function (s) { resume.appendChild(opt(s.sessionId, s.title)); });
        resumeLabel.hidden = list.length === 0;
      })
      .catch(function () { resumeLabel.hidden = true; });
  }
  repo.addEventListener("change", maybeLoadSessions);
  resume.addEventListener("change", function () {
    go.textContent = resume.value ? "Resume omp" : "Start omp";
  });
  box.addEventListener("toggle", function () {
    if (!box.open || loaded) return;
    loaded = true;
    Promise.all([
      fetch("/api/repos").then(function (r) { return r.json(); }),
      fetch("/api/models").then(function (r) { return r.json(); })
    ]).then(function (both) {
      var repos = both[0].repos || [], models = both[1].models || [];
      allRepos = repos;
      renderRepos();
      models.forEach(function (m) { model.appendChild(opt(m, m)); });
      modelLabel.hidden = models.length === 0;
      if (repos.length === 0) say(both[0].hint || "No repositories found under the configured roots.", false);
    }).catch(function (e) { loaded = false; say("could not load choices: " + e, true); });
  });
  document.getElementById("ns-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    go.disabled = true;
    var sessionId = resume.value;
    say(sessionId ? "resuming..." : "starting...", false);
    var req = sessionId
      ? fetch("/api/repos/" + encodeURIComponent(repo.value) + "/sessions/resume", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        })
      : fetch("/api/sessions", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ path: repo.value, model: model.value || null })
        });
    req.then(function (r) {
      if (r.status === 202) { say((sessionId ? "resuming" : "started") + "; it should appear below shortly", false); box.open = false; setTimeout(function () { location.reload(); }, 3000); return; }
      return r.text().then(function (t) { say("failed (" + r.status + "): " + t, true); });
    }).catch(function (e) { say("failed: " + e, true); }).then(function () { go.disabled = !repo.value; });
  });
  // The auto-refresh would wipe a half-filled form, so it pauses while open.
  function maybeReload() { if (!document.hidden && !box.open) location.reload(); }
  setInterval(maybeReload, 15000);
  // Background/mobile tabs throttle or fully suspend the interval above, so a
  // session named while the tab was hidden (e.g. the phone screen locked)
  // would otherwise stay showing its pre-hide render until the next tick, or
  // forever if the interval itself was suspended. Reloading right when the
  // tab regains visibility picks that up immediately.
  document.addEventListener("visibilitychange", maybeReload);
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button.stop, button.resume");
    if (!btn) return;
    var isResume = btn.classList.contains("resume");
    var prompt = isResume
      ? "Resume this omp session? It restarts the process (a brief drop, then a fresh session)."
      : "Close this omp session? This ends it for everyone.";
    if (!window.confirm(prompt)) return;
    btn.disabled = true;
    var url = "/api/sessions/" + btn.dataset.id + (isResume ? "/resume" : "");
    fetch(url, { method: isResume ? "POST" : "DELETE" }).then(function (r) {
      if (r.status === 202) { location.reload(); return; }
      return r.text().then(function (t) { window.alert("failed (" + r.status + "): " + t); btn.disabled = false; });
    }).catch(function (e) { window.alert("failed: " + e); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
